name: probe-clients

# 临时探针：用同一个视频试不同 player_client，看哪种能绕过机房 IP 的 bot 校验
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 安装 yt-dlp
        run: |
          python3 -m pip install --quiet --upgrade "yt-dlp[default]"
          yt-dlp --version

      - name: 逐客户端试探
        run: |
          VID="https://www.youtube.com/watch?v=WkPnKAHrkp4"
          echo "### 客户端探测结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| client | 结果 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in default web_safari tv ios android mweb tv_simply web_embedded; do
            echo "::group::client=$c"
            OUT=$(yt-dlp --no-warnings --simulate \
                    --extractor-args "youtube:player_client=$c" \
                    --print "%(upload_date)s | %(title).45s" "$VID" 2>&1 | tail -2)
            echo "$OUT"
            if echo "$OUT" | grep -qiE "not a bot|Sign in"; then
              echo "| $c | ❌ bot 校验 |" >> "$GITHUB_STEP_SUMMARY"
            elif echo "$OUT" | grep -qE "^[0-9]{8} \|"; then
              echo "| $c | ✅ 成功 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $c | ⚠️ 其他失败 |" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

      - name: 再试 flat 列表（不逐条解析）
        run: |
          echo "::group::flat search"
          yt-dlp --flat-playlist --simulate --no-warnings \
            --print "%(id)s | %(duration)s | %(title).50s" "ytsearch5:BMX flatland" 2>&1 | head -8
          echo "::endgroup::"
