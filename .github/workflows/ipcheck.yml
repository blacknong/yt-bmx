name: ipcheck
on:
  workflow_dispatch:
    inputs:
      vurl:
        description: 'googlevideo signed url'
        required: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: probe signed url from overseas runner
        env:
          VURL: ${{ inputs.vurl }}
        run: |
          python3 - <<'PY'
          import os, subprocess, urllib.parse
          u = os.environ['VURL']

          def probe(label, url):
              for f in ['/tmp/o.bin', '/tmp/h.txt']:
                  try: os.remove(f)
                  except OSError: pass
              cmd = ['curl', '-s', '-L', '-o', '/tmp/o.bin', '-D', '/tmp/h.txt',
                     '--max-time', '90', '-r', '0-4095', '-w', '%{http_code}', url]
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=100)
                  code = (r.stdout.strip().splitlines() or ['ERR'])[-1]
              except Exception as e:
                  code = 'ERR ' + str(e)[:60]
              h = open('/tmp/h.txt', errors='replace').read() if os.path.exists('/tmp/h.txt') else ''
              chain = [l.strip() for l in h.splitlines() if l.startswith('HTTP/')]
              size = os.path.getsize('/tmp/o.bin') if os.path.exists('/tmp/o.bin') else 0
              print(f'[{label}] final={code} chain={chain} bytes={size}')
              if size:
                  print(f'[{label}] magic={open("/tmp/o.bin","rb").read(16)!r}')

          probe('A-original', u)

          p = urllib.parse.urlsplit(u)
          q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query, keep_blank_values=True) if k != 'ip']
          u2 = urllib.parse.urlunsplit((p.scheme, p.netloc, p.path, urllib.parse.urlencode(q), p.fragment))
          probe('B-ip-stripped', u2)
          PY
